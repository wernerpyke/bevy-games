[workspace]
resolver = "3"
members = ["games/*", "crates/*"]
# Patched copy of bevy_enoki (see [patch.crates-io] below). It lies inside the workspace folder, so it must be excluded,
# or cargo makes it a member.
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
bevy = { version = "=0.20.1", default-features = false, features = ["2d"] }
bevy_aseprite_ultra = "=0.10.0"
bevy_enoki = "=0.8.0"
game-kit = { path = "crates/game-kit" }
pathfinding = "=4.16.0"

# Enoki with a per-material blend state (for additive blending, `game-kit` `fx.rs`). About 10 lines changed from 0.8.0.
[patch.crates-io]
bevy_enoki = { path = "vendor/bevy_enoki" }

# Compile dependencies (Bevy) with optimisation even in dev builds. Game code stays fast to rebuild.
# No debug info for dependencies, and only line tables for our own crates: nobody uses a debugger, and debug info
# was most of the size of `target/`. Panics still show file and line.
[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"

# Small web builds. Used with: cargo build --profile wasm-release --target wasm32-unknown-unknown
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
